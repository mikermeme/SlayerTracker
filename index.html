<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slayer Summons Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --surface-color: #1a1a1a;
            --surface-hover: #262626;
            --accent-color: #e53935;
            --accent-hover: #ef5350;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --completed-color: #2e7d32;
        }

        * { box-sizing: border-box; }

        /* Full viewport height layout with hidden outer scroll */
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* Top Bar - Sticky & Unaffected by horizontal scroll */
        .top-bar {
            flex-shrink: 0;
            background-color: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--accent-color);
            padding: 15px 25px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--text-main); text-transform: uppercase; letter-spacing: 2px; }
        h1 span { color: var(--accent-color); }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            overflow: visible !important;
        }

        select, input[type="text"], button {
            background-color: #000;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--surface-hover);
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* Unified scroll container for vertical & horizontal scroll */
        .scroll-container {
            flex-grow: 1;
            overflow: auto; /* Triggers always-visible scrollbars inside the viewport */
            position: relative;
        }

        /* Summary Section - Scrolls vertically, but stays pinned horizontally */
        .summary-container {
            position: sticky;
            left: 25px; 
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 20px 0 5px 0;
            margin: 0 25px;
            z-index: 10;
            pointer-events: none; /* Prevents background block interaction */

        }

        .summary-pill {
            background-color: #000;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto; /* Keeps pills interactive if needed */
        }

        .summary-pill strong { color: var(--accent-color); font-size: 1.5rem;}

        /* Board & Columns */
        .board-wrapper {
            width: 100%;
            padding: 15px 25px 25px 25px;

        }

        .board {
            display: flex;
            gap: 20px;
            width: max-content;
        }

        .category-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 480px; 
            width: 480px;
            background-color: #111;
            padding: 0 8px 8px 8px; /* Top padding is 0 for sticky alignment */
            border-radius: 8px;
            border: 1px solid var(--border-color);
            position: relative;

        }

/*        .category-column h2 {
            margin: 5px 0 10px 0;
            font-size: 1.5rem;
            color: var(--accent-color);
            text-align: center;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }*/

        /* Sticky category headers when scrolling down */
        .category-column h2 {
            position: sticky;
            top: 0;
            background-color: #111;
            z-index: 5;
            margin: 0;
            padding: 12px 0 8px 0;
            font-size: 1.5rem;
            color: var(--accent-color);
            text-align: center;
            /*text-transform: uppercase;*/
            border-bottom: 1px solid var(--border-color);
        }

        /* Quest Cards */
        .quest-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            width: 100%;
        }

        .quest-card:hover { border-color: var(--accent-hover); }

        .quest-card.completed { border-left-color: var(--completed-color); }
        .quest-card.replaced { opacity: 0.6; }
        /*.quest-card.replaced .quest-title { text-decoration: line-through; color: var(--text-muted); }*/
        .quest-card.replaced .quest-title {color: var(--text-muted); }

        /* Custom Green Checkbox */
        .title-checkbox {
            appearance: none;
            width: 20px; height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .title-checkbox:checked { background-color: var(--accent-color); border-color: var(--accent-color); }
        .title-checkbox.is-completed { background-color: var(--completed-color); border-color: var(--completed-color); cursor: default; }
        .title-checkbox.is-completed::after {
            content: '✔';
            position: absolute; color: white; font-size: 14px; left: 2px; top: -2px;
        }
        
        /* Prevent accidental text highlighting when clicking */
        .quest-header {
            display: flex;
            align-items: center;
            gap: 12px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Checkbox Styling */
        .title-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 0;
            flex-shrink: 0;
            accent-color: var(--accent-color); /* To-Do Red */
        }

        .title-checkbox.is-completed {
            accent-color: var(--completed-color); /* Completed Green */
            cursor: default;
        }

        .quest-title {
            margin: 0;
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-main);
            flex-grow: 1;
        }

        .status-replaced { font-size: 0.75rem; text-transform: uppercase; font-weight: bold; color: var(--text-muted); }

        /* Quest Details */
        .quest-details {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
            cursor: default;
            user-select: text;
            -webkit-user-select: text;
        }

        .quest-card.expanded .quest-details { display: block; }
        .quest-desc { white-space: pre-wrap; font-size: 0.95rem; color: var(--text-muted); margin-bottom: 15px; line-height: 1.4; }

        .code-embed {
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .code-embed code { color: #e6e6e6; font-family: monospace; font-size: 0.9rem; word-break: break-all; }
        .copy-btn { padding: 4px 10px; font-size: 0.8rem; }
        
        /* Inline Media Embeds */
        .media-container {
            margin-top: 15px;
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .media-container img, .media-container video {
            width: 100%;
            height: auto;
            display: block;
        }

        .media-container iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
            display: block;
        }

        .media-container a {
            display: inline-block;
            padding: 15px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            width: 100%;
        }
        
        .media-container a:hover { text-decoration: underline; background-color: var(--surface-hover); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        .loading { text-align: center; padding: 50px; font-size: 1.2rem; color: var(--text-muted); width: 100%; }
    </style>
</head>
<body>

    <!-- Sticky Header -->
    <div class="top-bar">
        <h1>Summons <span>//</span> Tracker</h1>
        <div class="controls">
            <select id="playerSelect">
                <option value="">Select a Player...</option>
            </select>
            <select id="filterSelect">
                <option value="all">All Quests</option>
                <option value="completed">Completed</option>
                <option value="incomplete">Incomplete</option>
                <option value="todo">My To-Do List</option>
            </select>
            <input type="text" id="searchInput" placeholder="Search quests...">
            <button id="expandBtn">Expand All</button>
            <button id="collapseBtn">Collapse All</button>
        </div>
    </div>
    
    <!-- Unified Scroll Container -->
    <div class="scroll-container" id="scrollContainer">
        
        <!-- Summary counts (Scrolls away vertically, stays locked horizontally) -->
        <div class="summary-container" id="summaryContainer">
            <!-- Summary counts injected here -->
        </div>


    <!-- Board Wrapper -->
    <div class="board-wrapper" id="boardWrapper">
        <div class="loading" id="loadingText">Fetching data from Google Sheets...</div>
        <div class="board" id="board">
            <!-- Columns injected here -->
        </div>


    <script>
        // ==========================================
        // CONFIGURATION: REPLACE THIS URL WITH YOURS
        // ==========================================
        // const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRKF0b3pHt2lo1HGy-93ulZ7y_GbnUbFKNSNC6bzLsa6XO73vkqrjtNrjjA4S6UieODRu-h_ZUXDfS-/pub?gid=1645289372&single=true&output=csv';

        const SHEET_ID = '1Xij6i1JIUT8iAdVgMDuwy9JzZGvMaU0xv85pSJZmElM';
        const GID = '1645289372'
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}&_=${Date.now()}`;

        // console.log(CSV_URL)

        // State
        let parsedQuests = [];
        let players = [];
        let todoSet = new Set(JSON.parse(localStorage.getItem('trackerTodo') || '[]'));
        let expandedSet = new Set();
        let selectedPlayerName = '';

        // DOM Elements
        const playerSelect = document.getElementById('playerSelect');
        const filterSelect = document.getElementById('filterSelect');
        const searchInput = document.getElementById('searchInput');
        const board = document.getElementById('board');
        const loadingText = document.getElementById('loadingText');
        const summaryContainer = document.getElementById('summaryContainer');
        const scrollContainer = document.getElementById('scrollContainer');


        // Initialization
        async function init() {
            setupEventListeners();
            await fetchCSVData();
            
            // Background polling every 60 seconds
            setInterval(() => fetchCSVData(true), 60000);
        }

        // Fetch & Parse Data
        async function fetchCSVData(isSilentRefresh = false) {
            if(!isSilentRefresh) loadingText.style.display = 'block';

            try {
                Papa.parse(CSV_URL, {
                    download: true,
                    header: false,
                    skipEmptyLines: false,
                    complete: function(results) {
                        processData(results.data);
                        if(!isSilentRefresh) loadingText.style.display = 'none';
                        renderBoard();
                    },
                    error: function(err) {
                        console.error(err);
                        loadingText.innerText = 'Error loading CSV. Check the URL and console.';
                    }
                });
            } catch (error) {
                console.error("Fetch Error:", error);
            }
        }

        function processData(data) {
            if(data.length < 7) return;

            const catRow = data[0];   // Row 1
            const nameRow = data[2];  // Row 3
            const descRow = data[3];  // Row 4
            const codeRow = data[4];  // Row 5
            const mediaRow = data[5]; // Row 6

            parsedQuests = [];
            let currentCat = "General";

            // K to DI (Indices 10 to 112) + DJ to DV (Indices 113 to 125)
            for(let i = 10; i <= 125; i++) {
                if (i >= catRow.length || i >= nameRow.length) continue;
                if (!nameRow[i] || nameRow[i].trim() === '') continue;

                if (i >= 113) {
                    currentCat = "After-Jarl Achievements";
                } else if (catRow[i] && catRow[i].trim() !== '') {
                    currentCat = catRow[i].trim();
                }

                parsedQuests.push({
                    index: i,
                    category: currentCat,
                    name: nameRow[i].trim(),
                    desc: descRow[i] ? descRow[i].trim() : '',
                    code: codeRow[i] ? codeRow[i].trim() : '',
                    media: mediaRow[i] ? mediaRow[i].trim() : '',
                    isLegendary: nameRow[i].toLowerCase().includes('legendary')
                });
            }

            players = [];
            for (let r = 6; r < data.length; r++) {
                const row = data[r];
                if (!row[0] && !row[1]) continue;

                players.push({
                    discordId: row[0],
                    name: row[1],
                    counts: {
                        "Contracts": row[2] || 0,
                        "Bounties": row[3] || 0,
                        "Summons": row[4] || 0,
                        "Berserker": row[5] || 0,
                        "Brute": row[6] || 0,
                        "Knight": row[7] || 0,
                        "Rogue": row[8] || 0,
                        "Legendary": row[9] || 0
                    },
                    rowData: row
                });
            }

            populatePlayerDropdown();
            determineSelectedPlayer();
        }

        function populatePlayerDropdown() {
            const currentVal = playerSelect.value;
            playerSelect.innerHTML = '<option value="">Select a Player...</option>';
            players.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name;
                opt.innerText = p.name;
                playerSelect.appendChild(opt);
            });
            playerSelect.value = currentVal;
        }

        function determineSelectedPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlPlayer = urlParams.get('player');

            if (urlPlayer) {
                const match = players.find(p => p.name.toLowerCase() === urlPlayer.toLowerCase());
                if (match) {
                    selectedPlayerName = match.name;
                    localStorage.setItem('trackerPlayer', selectedPlayerName);
                }
            } else {
                selectedPlayerName = localStorage.getItem('trackerPlayer') || '';
            }

            playerSelect.value = selectedPlayerName;
        }

        function evaluatePlayerProgress(player) {
            const progress = {};
            
            parsedQuests.forEach(q => {
                const val = player.rowData[q.index] ? player.rowData[q.index].trim().toUpperCase() : 'FALSE';
                progress[q.index] = { completed: val === 'TRUE', replaced: false };
            });

            parsedQuests.forEach((q, idx) => {
                if (q.isLegendary && progress[q.index].completed) {
                    if (idx > 0) {
                        const leftQuestIndex = parsedQuests[idx - 1].index;
                        progress[leftQuestIndex].replaced = true;
                        progress[leftQuestIndex].completed = false;
                    }
                }
            });

            return progress;
        }

        function generateMediaHTML(url) {
            if (!url) return '';
            
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
                else if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0];
                return `<div class="media-container"><iframe src="https://www.youtube.com/embed/${videoId}" allow="encrypted-media; fullscreen" allowfullscreen></iframe></div>`;
            } else if (url.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
                return `<div class="media-container"><img src="${url}" alt="Quest Media"></div>`;
            } else if (url.match(/\.(mp4|webm)$/i)) {
                return `<div class="media-container"><video controls><source src="${url}"></video></div>`;
            } else {
                return `<div class="media-container"><a href="${url}" target="_blank">View External Link</a></div>`;
            }
        }

        function renderBoard() {
            const player = players.find(p => p.name === selectedPlayerName);
            board.innerHTML = '';
            summaryContainer.innerHTML = '';

            if (!player) {
                board.innerHTML = '<div class="loading">Please select a player to view progression.</div>';
                return;
            }

            // Render Large Scrollable Summary Counts
            for (const [key, value] of Object.entries(player.counts)) {
                summaryContainer.innerHTML += `<div class="summary-pill">${key}: <strong>${value}</strong></div>`;
            }

            const progress = evaluatePlayerProgress(player);
            const filterState = filterSelect.value;
            const searchVal = searchInput.value.toLowerCase();

            const categories = ["General", "Berserker", "Brute", "Knight", "Rogue", "After-Jarl Achievements"];
            
            // Save scroll coordinates from unified container
            const scrollX = scrollContainer.scrollLeft;
            const scrollY = scrollContainer.scrollTop;

            categories.forEach(cat => {
                const catQuests = parsedQuests.filter(q => q.category === cat);
                if (catQuests.length === 0) return;

                const colDiv = document.createElement('div');
                colDiv.className = 'category-column';
                colDiv.innerHTML = `<h2>${cat}</h2>`;

                let questsAdded = 0;

                catQuests.forEach(q => {
                    const status = progress[q.index];
                    const isTodo = todoSet.has(q.index);

                    if (status.completed && isTodo) {
                        todoSet.delete(q.index);
                        saveTodos();
                    }

                    if (filterState === 'completed' && !status.completed) return;
                    if (filterState === 'incomplete' && status.completed) return;
                    if (filterState === 'todo' && !todoSet.has(q.index)) return;
                    if (searchVal && !q.name.toLowerCase().includes(searchVal) && !q.desc.toLowerCase().includes(searchVal)) return;

                    const card = document.createElement('div');
                    card.className = `quest-card ${status.completed ? 'completed' : ''} ${status.replaced ? 'replaced' : ''} ${expandedSet.has(q.index) ? 'expanded' : ''}`;
                    card.onclick = () => toggleExpand(q.index, card);

                    // Checkbox Logic
                    let checkboxHtml = '';
                    if (status.completed) {
                        // Completed = Green Checkbox, locked
                        checkboxHtml = `<input type="checkbox" class="title-checkbox is-completed" checked disabled onclick="event.stopPropagation();">`;
                    } else if (status.replaced) {
                        // Replaced = Disabled unchecked
                        checkboxHtml = `<input type="checkbox" class="title-checkbox is-completed" checked disabled onclick="event.stopPropagation();">`;
                    } else {
                        // Incomplete = Red To-Do Checkbox, interactable
                        checkboxHtml = `<input type="checkbox" class="title-checkbox" ${isTodo ? 'checked' : ''} onclick="event.stopPropagation(); toggleTodo(${q.index}, this.checked);">`;
                    }

                    // // Title Logic
                    // let replacedTag = status.replaced ? '<span class="status-replaced">Legendary Completed</span>' : '';

                    // Details Logic
                    let detailsHtml = `
                        <div class="quest-details" onclick="event.stopPropagation()">
                            <div class="quest-desc">${q.desc || 'No description provided.'}</div>
                    `;

                    if (q.code) {
                        detailsHtml += `
                            <div class="code-embed">
                                <code>${q.code}</code>
                                <button class="copy-btn" onclick="copyText(this, \`${q.code.replace(/`/g, '\\`')}\`)">Copy</button>
                            </div>
                        `;
                    }

                    if (q.media) {
                        detailsHtml += generateMediaHTML(q.media);
                    }

                    detailsHtml += `</div>`;

                    // Construct Card
                    card.innerHTML = `
                        <div class="quest-header">
                            ${checkboxHtml}
                            <h3 class="quest-title">${q.name}</h3>
                        </div>
                        ${detailsHtml}
                    `;

                    colDiv.appendChild(card);
                    questsAdded++;
                });

                if (questsAdded > 0) {
                    board.appendChild(colDiv);
                }
            });

            // Restore scroll positions inside unified container
            scrollContainer.scrollLeft = scrollX;
            scrollContainer.scrollTop = scrollY;
        }

        // Interactivity
        function setupEventListeners() {
            playerSelect.addEventListener('change', (e) => {
                selectedPlayerName = e.target.value;
                localStorage.setItem('trackerPlayer', selectedPlayerName);
                
                const url = new URL(window.location);
                url.searchParams.delete('player');
                window.history.replaceState({}, '', url);
                
                renderBoard();
            });

            filterSelect.addEventListener('change', renderBoard);
            searchInput.addEventListener('input', renderBoard);
            
            document.getElementById('expandBtn').addEventListener('click', () => {
                parsedQuests.forEach(q => expandedSet.add(q.index));
                renderBoard();
            });
            
            document.getElementById('collapseBtn').addEventListener('click', () => {
                expandedSet.clear();
                renderBoard();
            });
        }

        function toggleExpand(index, cardEl) {
            // Prevent toggling if user is highlighting details text
            if(window.getSelection().toString().length > 0) return;
            
            if (expandedSet.has(index)) {
                expandedSet.delete(index);
                cardEl.classList.remove('expanded');
            } else {
                expandedSet.add(index);
                cardEl.classList.add('expanded');
            }
        }

        function toggleTodo(index, isChecked) {
            if (isChecked) todoSet.add(index);
            else todoSet.delete(index);
            saveTodos();
        }

        function saveTodos() {
            localStorage.setItem('trackerTodo', JSON.stringify(Array.from(todoSet)));
        }

        function copyText(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerText;
                btn.innerText = 'Copied!';
                btn.style.backgroundColor = 'var(--completed-color)';
                btn.style.borderColor = 'var(--completed-color)';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = '';
                    btn.style.borderColor = '';
                }, 2000);
            });
        }

        // Run
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
